ShortDescription: Hardware info and sensor monitor for Windows, with dashboards and a game overlay.
Description: |-
  Siliconsole is a free, open source hardware info and sensor monitor for PC gamers and enthusiasts:
  a CPU-Z style System Info page, an HWiNFO style Sensors tree, drag-and-drop dashboards, swappable themes,
  a click-through overlay, threshold alerts and CSV logging. It only reads sensors (no fan control or overclocking).
  The installer adds a background Windows service that runs as LocalSystem to read hardware sensors, and can
  optionally download the PawnIO driver after asking.
